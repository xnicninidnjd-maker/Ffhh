<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой ИИ-помощник</title>
<style>
:root{--bg:#faf9f6;--card:#fff;--tx:#1f1e1d;--mu:#6b6963;--ac:#c6613f;--bd:#e5e2db;--me:#f0e6df}
@media (prefers-color-scheme:dark){:root{--bg:#1f1e1d;--card:#2a2928;--tx:#f0eee8;--mu:#a09d95;--bd:#3d3b38;--me:#3a2f29}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
nav{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--bd)}
nav button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
section{display:none;flex:1;min-height:0;flex-direction:column}section.on{display:flex}
.opt{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd)}
select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;min-width:0}
.opt select{flex:1;font-size:14px;padding:8px}
.list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 13px;border-radius:14px;background:var(--card);border:1px solid var(--bd);white-space:pre-wrap;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--me)}
.bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--bd)}
.bar textarea{flex:1;resize:none}
.go{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-size:15px}.go:disabled{opacity:.5}
.note{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.note h3{margin:0 0 4px;font-size:16px}.note p{margin:0 0 8px;color:var(--mu);white-space:pre-wrap;overflow-wrap:anywhere}
.act{display:flex;flex-wrap:wrap;gap:6px}.act button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:14px}
.out{margin-top:8px;padding:10px;border-radius:10px;background:var(--me);white-space:pre-wrap;overflow-wrap:anywhere}
.form{display:flex;flex-direction:column;gap:8px;padding:12px;border-top:1px solid var(--bd)}
.pad{padding:16px;display:flex;flex-direction:column;gap:10px}.hint{color:var(--mu);font-size:14px}
</style></head><body>
<nav><button id="t1" class="on">Чат</button><button id="t2">Заметки</button><button id="t3">Настройки</button></nav>
<div class="opt">
<select id="mdl"><option value="gemini-flash-latest">Gemini Flash (быстрая)</option><option value="gemini-flash-lite-latest">Gemini Flash-Lite (самая быстрая)</option></select>
<select id="eff"><option value="low">Усилие: низкое</option><option value="medium" selected>Усилие: среднее</option><option value="high">Усилие: максимальное</option></select>
</div>
<section id="s1" class="on"><div id="log" class="list"><div class="m">Привет! Я ваш ИИ-помощник. Спросите что угодно.</div></div>
<div class="bar"><textarea id="q" rows="1" placeholder="Сообщение…"></textarea><button class="go" id="send">→</button></div></section>
<section id="s2"><div id="nlist" class="list"></div>
<div class="form"><input id="nt" placeholder="Заголовок"><textarea id="nb" rows="3" placeholder="Текст заметки…"></textarea><button class="go" id="add">Сохранить заметку</button></div></section>
<section id="s3"><div class="pad"><label>Бесплатный ключ Gemini</label><input id="key" type="password" placeholder="AIza…"><button class="go" id="ks">Сохранить и загрузить модели</button>
<div class="hint">Ключ хранится только на этом телефоне. Получить его бесплатно: aistudio.google.com/apikey</div><div id="kst" class="hint"></div></div></section>
<script>
const $=id=>document.getElementById(id);let hist=[],busy=false,notes=[];
const B="https://generativelanguage.googleapis.com/v1beta/";
try{notes=JSON.parse(localStorage.getItem("notes")||"[]")}catch(e){}
const sv=()=>{try{localStorage.setItem("notes",JSON.stringify(notes))}catch(e){}};
const getK=()=>{try{return localStorage.getItem("gk")||""}catch(e){return ""}};
$("key").value=getK();
[1,2,3].forEach(n=>$("t"+n).onclick=()=>{[1,2,3].forEach(i=>{$("s"+i).classList.toggle("on",i==n);$("t"+i).classList.toggle("on",i==n)})});
async function models(){
  const k=getK();if(!k)return;$("kst").textContent="Загружаю список моделей…";
  try{const r=await fetch(B+"models?pageSize=100&key="+encodeURIComponent(k));const j=await r.json();
    if(!r.ok)throw new Error((j.error&&j.error.message)||("Ошибка "+r.status));
    const l=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")&&/gemini/.test(m.name)&&!/image|tts|embed|live|audio|robotics|computer|thinking-exp/.test(m.name));
    if(!l.length)throw new Error("Подходящих моделей не нашлось.");
    const cur=$("mdl").value;$("mdl").textContent="";
    l.forEach(m=>{const o=document.createElement("option");o.value=m.name.replace("models/","");o.textContent=m.displayName||o.value;$("mdl").appendChild(o)});
    const pick=[...$("mdl").options].find(o=>o.value==cur)||[...$("mdl").options].find(o=>o.value=="gemini-flash-latest");if(pick)pick.selected=true;
    $("kst").textContent="Готово: моделей "+l.length+". Ключ работает."}
  catch(e){$("kst").textContent="Ошибка: "+e.message}
}
$("ks").onclick=()=>{try{localStorage.setItem("gk",$("key").value.trim())}catch(e){}models()};
models();
const EF={low:{t:2048,s:" Отвечай очень кратко."},medium:{t:4096,s:""},high:{t:8192,s:" Рассуждай тщательно, проверяй себя и давай подробный ответ."}};
async function ask(messages,onText){
  const k=getK();if(!k)throw new Error("Добавьте ключ во вкладке «Настройки».");
  const e=EF[$("eff").value];
  const body={systemInstruction:{parts:[{text:"Ты дружелюбный ИИ-помощник. Отвечай по-русски."+e.s}]},
    contents:messages.map(m=>({role:m.role=="assistant"?"model":"user",parts:[{text:m.content}]})),generationConfig:{maxOutputTokens:e.t}};
  const r=await fetch(B+"models/"+$("mdl").value+":streamGenerateContent?alt=sse&key="+encodeURIComponent(k),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){let m="Ошибка "+r.status;try{const j=await r.json();if(j.error&&j.error.message)m=j.error.message}catch(x){}
    if(r.status==429)m="Лимит бесплатных запросов исчерпан. Подождите минуту или выберите Flash-Lite.";throw new Error(m)}
  const rd=r.body.getReader(),dc=new TextDecoder();let buf="",acc="";
  while(true){const {done,value}=await rd.read();if(done)break;
    buf+=dc.decode(value,{stream:true});const ls=buf.split("\n");buf=ls.pop();
    for(const l of ls){if(!l.startsWith("data:"))continue;
      try{const j=JSON.parse(l.slice(5));const ps=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
        const t=ps.filter(p=>!p.thought).map(p=>p.text||"").join("");if(t){acc+=t;onText(acc)}}catch(x){}}}
  if(!acc)throw new Error("Пустой ответ. Попробуйте ещё раз или другую модель.");
  return acc;
}
function addMsg(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;$("log").appendChild(d);$("log").scrollTop=1e9;return d}
async function send(){const t=$("q").value.trim();if(!t||busy)return;$("q").value="";busy=true;$("send").disabled=true;
  addMsg(t,"me");hist.push({role:"user",content:t});const o=addMsg("…","");
  try{const x=await ask(hist,s=>{o.textContent=s;$("log").scrollTop=1e9});o.textContent=x;hist.push({role:"assistant",content:x})}
  catch(e){o.textContent=e.message;hist.pop()}
  busy=false;$("send").disabled=false}
$("send").onclick=send;
$("q").addEventListener("keydown",e=>{if(e.key=="Enter"&&!e.shiftKey){e.preventDefault();send()}});
function render(){const l=$("nlist");l.textContent="";
  if(!notes.length){const h=document.createElement("div");h.className="hint";h.textContent="Заметок пока нет.";l.appendChild(h);return}
  notes.forEach((n,i)=>{const c=document.createElement("div");c.className="note";
    const h=document.createElement("h3");h.textContent=n.t||"Без названия";
    const p=document.createElement("p");p.textContent=n.b;
    const o=document.createElement("div");o.className="out";o.hidden=true;
    const a=document.createElement("div");a.className="act";
    [["Кратко","Сделай краткое резюме в 3–4 пунктах."],["Тест","Составь 3 вопроса для самопроверки с ответами в конце."],["Объясни проще","Объясни простыми словами, как для школьника."]].forEach(([nm,pr])=>{
      const b=document.createElement("button");b.textContent=nm;
      b.onclick=async()=>{o.hidden=false;o.textContent="…";try{o.textContent=await ask([{role:"user",content:pr+"\n\nЗаметка:\n"+n.b}],s=>{o.textContent=s})}catch(e){o.textContent=e.message}};a.appendChild(b)});
    const d=document.createElement("button");d.textContent="Удалить";d.onclick=()=>{notes.splice(i,1);sv();render()};a.appendChild(d);
    c.append(h,p,a,o);l.appendChild(c)})}
$("add").onclick=()=>{const b=$("nb").value.trim();if(!b)return;notes.unshift({t:$("nt").value.trim(),b});sv();$("nt").value="";$("nb").value="";render()};
render();
</script></body></html>
